[package]
name = "binance-auditor-migration"
version = "1.0.0"
description = "Herramienta de migracion SQLite -> PostgreSQL para Binance Pay Auditor"
authors = []
edition = "2021"

[[bin]]
name = "migrate"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
anyhow = "1"

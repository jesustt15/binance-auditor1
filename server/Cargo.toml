[package]
name = "binance-auditor-server"
version = "1.0.0"
description = "Servidor multi-usuario con anti-fraude para Binance Pay Auditor"
authors = []
edition = "2021"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["macros", "multipart"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "auth"] }
tower_governor = "0.8"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Auth
argon2 = "0.5"
jsonwebtoken = "9"
sha2 = "0.10"

# IMAP + email parsing (server-side sync)
imap = { version = "3.0.0-alpha.15", default-features = false, features = ["rustls-tls"] }
mailparse = "0.15"
rustls-connector = "0.19"
mail-auth = "0.5"

# Encryption for credential storage
age = "0.11"

# Excel export
rust_xlsxwriter = "0.93"

# CSV/Excel import
csv = "1.3"
calamine = "0.26"

# Utilities
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
thiserror = "2"
dirs = "6"
rand = "0.8"
dotenvy = "0.15"
